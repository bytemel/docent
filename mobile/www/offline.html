<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Docent: no connection</title>
<style>
:root{--bg:#f3f4f1;--surface:#fff;--ink:#101214;--ink-2:#3f444b;--line:#d9dcd5;--accent:#ffc61a;--accent-ink:#101214}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f11;--surface:#16191c;--ink:#f2f3f0;--ink-2:#c9cdd2;--line:#2c3238}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:1.25rem;max-width:30rem;margin:0 auto;padding:max(2rem,env(safe-area-inset-top)) 1.5rem max(2rem,env(safe-area-inset-bottom))}
h1{margin:0;font-size:2rem;line-height:1.05;font-weight:800;letter-spacing:-0.02em;text-wrap:balance}
p{margin:0;font-size:1.0625rem;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
button{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:1.5px solid var(--accent);border-radius:16px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:1.0625rem;font-weight:700}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:.9375rem}
</style>
</head>
<body>
<main>
<svg viewBox="0 0 32 32" width="72" height="72" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#ffc61a"/><path d="M10.5 25V17.5C10.5 14.46 12.96 12 16 12H19" fill="none" stroke="#101214" stroke-width="3.4" stroke-linecap="round"/><path d="M18.5 6.8L25.4 12L18.5 17.2Z" fill="#101214" stroke="#101214" stroke-width="1.2" stroke-linejoin="round"/></svg>
<h1>No connection</h1>
<p>Docent needs the internet to open. Check your mobile data or Wi-Fi, then try again.</p>
<p class="hint">Routes you saved for offline on this phone open again once Docent has loaded.</p>
<button type="button" id="retry">Try again</button>
</main>
<script>
document.getElementById("retry").addEventListener("click", function () { location.href = "https://docent-drab.vercel.app/"; });
window.addEventListener("online", function () { location.href = "https://docent-drab.vercel.app/"; });
</script>
</body>
</html>
