name: Android

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install
        run: npm ci

      - name: Sync the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk docent-android-debug.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: docent-android-debug
          path: mobile/docent-android-debug.apk
          if-no-files-found: error

      - name: Decode the upload keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/docent-upload.jks"
          echo "path=$RUNNER_TEMP/docent-upload.jks" >> "$GITHUB_OUTPUT"

      - name: Build the signed release AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../docent-android-release.aab

      - name: Upload the AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docent-android-release
          path: mobile/docent-android-release.aab
          if-no-files-found: error

      - name: Remove the previous android-latest release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete android-latest --cleanup-tag --yes || true

      - name: Publish the android-latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: Docent for Android (latest build)
          body: |
            Latest Android build of Docent from ${{ github.sha }}, build ${{ github.run_number }}.
            Download docent-android-debug.apk on your Android phone and open it to install.
            Android will ask you to allow installs from your browser or file manager the first time.
          files: |
            mobile/docent-android-debug.apk
            mobile/docent-android-release.aab
          fail_on_unmatched_files: false
          make_latest: true
